name: Debug Secret

on:
  workflow_dispatch:  # Manual trigger

jobs:
  print-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Print encoded secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}   # Replace with your secret name
        run: |
          echo "Secret length: ${LUMIROM_BUILD}"
          echo "Base64 encoded secret: $(echo -n "$MY_SECRET" | base64)"
