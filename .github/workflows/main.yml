name: Debug Secret

on:
  workflow_dispatch:

jobs:
  print-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Print encoded secret
        env:
          LUMIROM_BUILD: ${{ secrets.LUMIROM_BUILD }}   # Make this match your secret name
        run: |
          if [ -z "$LUMIROM_BUILD" ]; then
            echo "Secret is empty or not found!"
          else
            echo "Secret length: ${#LUMIROM_BUILD}"
            echo "Base64 encoded secret: $(echo -n "$LUMIROM_BUILD" | base64)"
          fi
